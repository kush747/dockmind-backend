spring.application.name=apollo-backend

server.port=8080

#gemini config

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.6-flash}

#postgres configurations

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dockmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

#pgvector config
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/BAAI/bge-base-en-v1.5/resolve/main/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/BAAI/bge-base-en-v1.5/raw/main/tokenizer.json


spring.servlet.multipart.max-file-size=25MB

app.rag.chunk-size=700
app.rag.chunk-overlap=100
app.rag.top-k=5
app.rag.similarity-threshold=0.0

app.cors.allowed-origins="*"
app.cors.allowed-methods="GET,POST,PUT,DELETE,OPTIONS"
app.cors.allowed-headers="*"







